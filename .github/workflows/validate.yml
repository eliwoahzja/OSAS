name: Validate OSAS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint and production build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run syntax checks
        run: npm run lint
      - name: Run regression tests
        run: npm test
      - name: Build application
        run: npm run build
      - name: Verify static deployment output
        run: |
          test -f dist/index.html
          test -f dist/js/app.js
          test -f dist/js/config.js
          test -f dist/css/osas.css
          test -f dist/assets/logo.png
          test ! -e dist/supabase
          test ! -e dist/server.js
          test ! -e dist/.env.example
