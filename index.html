<noscript><div class="safety-landing safety-fallback"><header class="safety-container safety-header"><p>St. Agnes Academy<br>Office of Student Affairs &amp; Services</p></header><main class="safety-container"><section class="safety-hero"><h1>Campus safety guide.</h1><p class="safety-lead">Read the response steps before your next school drill.</p></section>
<section class="safety-section"><h2>Disaster response</h2><details class="safety-drill-entry"><summary><h3>Earthquakes</h3></summary><p>Drop, cover, and hold on. Wait for the shaking to stop before evacuating.</p><h3>Before: Find your safe spots</h3><ul><li>Locate sturdy tables and the posted evacuation routes.</li><li>Keep exits clear. Ask staff to secure heavy furniture.</li><li>Join school drills and learn your assembly area.</li></ul><h3>During: Protect yourself first</h3><ul><li>Drop low, take cover under a sturdy table, and hold on.</li><li>Protect your head and neck. Stay clear of windows and falling objects.</li><li>Stay inside during shaking. Do not rush to the stairs.</li></ul><h3>After: Leave when safe</h3><ul><li>After shaking stops, follow the safe evacuation route. Use stairs.</li><li>Stay with your class for headcount and expect aftershocks.</li><li>Keep away from damaged buildings until authorities clear them.</li></ul><p class="safety-source"><a href="https://www.dost.gov.ph/knowledge-resources/news/4423-dost-s-solidum-reiterates-preparedness-is-key-amidst-earthquake.html" target="_blank" rel="noopener noreferrer">DOST / PHIVOLCS</a></p><p class="safety-source"><a href="https://region1.dost.gov.ph/wp-content/uploads/2025/10/RED_Book-1.pdf" target="_blank" rel="noopener noreferrer">PHIVOLCS preparedness guide</a></p></details><details class="safety-drill-entry"><summary><h3>Fires</h3></summary><p>Raise the alarm and evacuate immediately using the nearest safe exit.</p><h3>Before: Keep the way clear</h3><ul><li>Learn the fire exits and an alternative escape route.</li><li>Keep flammable materials away from heat.</li><li>Report damaged wiring and avoid overloaded outlets.</li></ul><h3>During: Get out safely</h3><ul><li>Sound the alarm, alert school staff, and evacuate immediately.</li><li>Use stairs. Stay low if you encounter smoke.</li><li>Do not open a hot door. Use another safe exit.</li></ul><h3>After: Stay at the assembly area</h3><ul><li>Report to your teacher or marshal for headcount.</li><li>Tell responders if someone is missing. Do not go back inside.</li><li>Return only after authorities declare the building safe.</li></ul><p class="safety-source"><a href="https://quezoncity.gov.ph/qcitizen-guides/fire-safety-tips/" target="_blank" rel="noopener noreferrer">Quezon City Government fire safety</a></p></details><details class="safety-drill-entry"><summary><h3>Typhoons</h3></summary><p>Monitor official weather bulletins and follow evacuation instructions early.</p><h3>Before: Prepare early</h3><ul><li>Check PAGASA bulletins and official school announcements.</li><li>Know your evacuation plan and prepare an emergency bag.</li><li>Evacuate when instructed, before routes become unsafe.</li></ul><h3>During: Shelter safely</h3><ul><li>Stay indoors, away from glass windows.</li><li>Keep a flashlight ready and follow official updates.</li><li>Stay in the designated shelter until authorities give clearance.</li></ul><h3>After: Watch for hazards</h3><ul><li>Avoid damaged structures, fallen trees, and power lines.</li><li>Return only when authorities say your area is safe.</li><li>Have wet electrical equipment checked before use.</li></ul><p class="safety-source"><a href="https://quezoncity.gov.ph/qcitizen-guides/what-to-do-during-tropical-cyclone/" target="_blank" rel="noopener noreferrer">Quezon City Government cyclone preparedness</a></p></details><details class="safety-drill-entry"><summary><h3>Floods</h3></summary><p>Move to a safe, higher area early. Keep out of floodwater.</p><h3>Before: Know the warning signs</h3><ul><li>Learn local flood warnings and your evacuation destination.</li><li>Keep emergency supplies and contact details ready.</li><li>Move to a safe area before floodwater cuts off access.</li></ul><h3>During: Avoid the water</h3><ul><li>Do not wade, swim, or play in floodwater.</li><li>Avoid flooded roads, bridges, and flowing rivers.</li><li>Follow evacuation instructions and use safe drinking water.</li></ul><h3>After: Return with care</h3><ul><li>Stay away from broken wires and damaged utility lines.</li><li>Do not eat food or drink water contaminated by flooding.</li><li>Have electrical outlets and appliances checked before switching them on.</li></ul><p class="safety-source"><a href="https://pagasa.dost.gov.ph/learning-tools/floods" target="_blank" rel="noopener noreferrer">DOST-PAGASA flood safety rules</a></p></details></section>
<section class="safety-section"><h2>Drills and evacuation</h2><p>Follow your teacher or marshal and the posted campus plan.</p><details class="safety-drill-entry"><summary><h3>Earthquake drill</h3></summary><ol><li><strong>Recognize the signal</strong><p>Listen for the announced drill alarm.</p></li><li><strong>Drop, cover, and hold on</strong><p>Practise the protective response during simulated shaking.</p></li><li><strong>Evacuate after shaking</strong><p>Follow the designated route calmly when the drill leader directs.</p></li><li><strong>Assemble and account</strong><p>Stay with your class at the assembly area for roll call.</p></li><li><strong>Review and improve</strong><p>Report blocked exits or other problems during the debrief.</p></li></ol><p class="safety-source"><a href="https://tec.deped.gov.ph/wp-content/uploads/2020/09/PPST.RP_Module-15.pdf" target="_blank" rel="noopener noreferrer">DepEd school drill stages</a></p></details><details class="safety-drill-entry"><summary><h3>Fire evacuation drill</h3></summary><ol><li><strong>Respond to the alarm</strong><p>Stop your activity and follow staff instructions.</p></li><li><strong>Use the safe exit</strong><p>Leave by the designated route. Use stairs, not elevators.</p></li><li><strong>Report for headcount</strong><p>Tell your teacher or marshal if someone is missing.</p></li><li><strong>Wait for the all-clear</strong><p>Remain in the assembly area until instructed otherwise.</p></li></ol><p class="safety-source"><a href="https://quezoncity.gov.ph/qcitizen-guides/fire-safety-tips/" target="_blank" rel="noopener noreferrer">Fire evacuation guidance</a></p></details><details class="safety-drill-entry"><summary><h3>Typhoon preparation</h3></summary><ol><li><strong>Follow official updates</strong><p>Check PAGASA bulletins and school announcements.</p></li><li><strong>Prepare to evacuate</strong><p>Know the evacuation plan and keep an emergency bag ready.</p></li><li><strong>Move when instructed</strong><p>Go to the designated shelter before routes become unsafe.</p></li><li><strong>Wait for clearance</strong><p>Stay in the shelter until authorities say your area is safe.</p></li></ol><p class="safety-source"><a href="https://quezoncity.gov.ph/qcitizen-guides/what-to-do-during-tropical-cyclone/" target="_blank" rel="noopener noreferrer">Cyclone preparedness guidance</a></p></details><details class="safety-drill-entry"><summary><h3>Flood evacuation</h3></summary><ol><li><strong>Know the warning</strong><p>Learn local flood warnings and your evacuation destination.</p></li><li><strong>Move early</strong><p>Reach a safe, higher area before floodwater cuts off access.</p></li><li><strong>Keep out of floodwater</strong><p>Avoid flooded roads, bridges, and flowing rivers.</p></li><li><strong>Return with care</strong><p>Stay away from broken wires and damaged utility lines.</p></li></ol><p class="safety-source"><a href="https://pagasa.dost.gov.ph/learning-tools/floods" target="_blank" rel="noopener noreferrer">PAGASA flood safety rules</a></p></details><p>For drill dates and your assigned assembly area, follow official school announcements and your classroom evacuation plan.</p></section>
<section class="safety-section safety-reminders"><h2>Readiness reminders</h2><ul><li>Know your nearest exit and an alternative route.</li><li>Know your class assembly area.</li><li>Know which teacher or marshal to report to.</li><li>Discuss any assistance you need with school staff.</li><li>Have your emergency contact details ready.</li><li>Know the school’s family reunification instructions.</li></ul><p>Check the evacuation map posted in your classroom. Confirm the assembly area and any assistance arrangements with school staff.</p></section>
<section class="safety-section"><h2>Sign in to OSAS</h2><p>Enable JavaScript to sign in and use the dashboard. The safety information above is available without signing in.</p></section></main><footer class="safety-container safety-footer"><p>During an emergency, follow school marshals and local authorities.</p></footer></div></noscript>
